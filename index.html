<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국사 퀴즈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      padding: 24px;
    }
    h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
    .hidden { display: none !important; }
    #login-screen input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .info-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #374151;
      font-weight: 600;
    }
    .timer.warning { color: #ef4444; }
    .question { font-size: 1.15rem; margin-bottom: 18px; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .option:hover { border-color: #4f46e5; background: #f5f3ff; }
    .option.correct { border-color: #10b981; background: #d1fae5; }
    .option.wrong { border-color: #ef4444; background: #fee2e2; }
    .option.disabled { pointer-events: none; }
    .explanation {
      margin-top: 16px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-line;
    }
    .score-box {
      text-align: center;
      font-size: 1.6rem;
      margin: 20px 0;
      font-weight: 700;
    }
    .time-box {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #374151;
    }
    .result-buttons { display: flex; gap: 10px; }
    .result-buttons button { flex: 1; }
    .secondary { background: #6b7280; }
    .secondary:hover { background: #4b5563; }
    .review-list { margin-top: 20px; }
    .review-item {
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #f9fafb;
    }
    .review-item:hover { background: #f3f4f6; }
    .review-item .num { font-weight: 600; margin-right: 8px; }
    .menu-section { margin-bottom: 20px; }
    .menu-title { font-weight: 700; margin-bottom: 10px; font-size: 1.1rem; }
    .menu-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .menu-buttons button { flex: 1; min-width: 120px; margin-top: 0; }
    .giveup-btn {
      background: #ef4444;
      width: auto;
      padding: 8px 16px;
      font-size: 0.85rem;
      margin: 8px auto 0;
      display: block;
    }
    .giveup-btn:hover { background: #dc2626; }
    .confirm-box {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .confirm-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      width: 280px;
    }
    .confirm-content p { margin-bottom: 16px; font-size: 1.05rem; }
    .confirm-buttons { display: flex; gap: 10px; }
    .confirm-buttons button { flex: 1; margin-top: 0; }
    .countdown-screen {
      text-align: center;
      padding: 60px 0;
    }
    .countdown-text {
      font-size: 5rem;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 30px;
    }
    .back-btn {
      background: #6b7280;
      width: auto;
      padding: 10px 20px;
      font-size: 0.9rem;
      margin: 0 auto;
      display: block;
    }
    .back-btn:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-screen">
      <h1>🔒 한국사 퀴즈</h1>
      <p style="text-align:center; margin-bottom:20px; color:#666;">비밀번호를 입력하세요</p>
      <input type="password" id="password" placeholder="비밀번호 입력" autofocus>
      <button onclick="checkPassword()">입장하기</button>
      <p id="error-msg" style="color:#ef4444; text-align:center; margin-top:12px; font-size:0.9rem;"></p>
    </div>

    <div id="menu-screen" class="hidden">
      <h1>퀴즈 선택</h1>
      <div class="menu-section">
        <div class="menu-title">전범위</div>
        <div class="menu-buttons">
          <button onclick="prepareQuiz('all', 20, 20)">20문제 (20분)</button>
          <button onclick="prepareQuiz('all', 30, 30)">30문제 (30분)</button>
          <button onclick="prepareQuiz('all', 50, 50)">50문제 (50분)</button>
          <button onclick="prepareQuiz('all', 100, 100)">100문제 (100분)</button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-title">시대별</div>
        <div class="menu-buttons">
          <button onclick="prepareQuiz('ancient', 10, 10)">선사~고대 10문제</button>
          <button onclick="prepareQuiz('ancient', 20, 20)">선사~고대 20문제</button>
          <button onclick="prepareQuiz('goryeo', 10, 10)">고려 10문제</button>
          <button onclick="prepareQuiz('goryeo', 20, 20)">고려 20문제</button>
          <button onclick="prepareQuiz('joseon', 10, 10)">조선 10문제</button>
          <button onclick="prepareQuiz('joseon', 20, 20)">조선 20문제</button>
          <button onclick="prepareQuiz('modern', 10, 10)">근대 10문제</button>
          <button onclick="prepareQuiz('modern', 20, 20)">근대 20문제</button>
          <button onclick="prepareQuiz('contemporary', 10, 10)">현대 10문제</button>
          <button onclick="prepareQuiz('contemporary', 20, 20)">현대 20문제</button>
        </div>
      </div>
      <button class="secondary" onclick="logout()">나가기</button>
    </div>

    <div id="countdown-screen" class="hidden">
      <div class="countdown-screen">
        <div class="countdown-text" id="countdown-num">3</div>
        <button class="back-btn" onclick="cancelCountdown()">돌아가기</button>
      </div>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="info-bar">
        <span id="progress">1 / 20</span>
        <span id="timer" class="timer">20:00</span>
        <span id="score-display">점수: 0</span>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="explanation" class="explanation hidden"></div>
      <button id="next-btn" class="hidden" onclick="nextQuestion()">다음 문제</button>
      <button class="giveup-btn" onclick="confirmGiveUp()">포기하기</button>
    </div>

    <div id="result-screen" class="hidden">
      <h1>결과</h1>
      <div class="score-box" id="final-score"></div>
      <div class="time-box" id="time-left"></div>
      <div class="result-buttons">
        <button onclick="goToMenu()">메뉴로</button>
        <button class="secondary" onclick="logout()">나가기</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </div>

    <div id="review-screen" class="hidden">
      <div class="info-bar">
        <span id="review-progress"></span>
        <button onclick="backToResult()" style="width:auto; padding:8px 16px; margin:0;">목록으로</button>
      </div>
      <div class="question" id="review-question"></div>
      <div class="options" id="review-options"></div>
      <div id="review-explanation" class="explanation"></div>
    </div>

    <div id="confirm-box" class="confirm-box hidden">
      <div class="confirm-content">
        <p>정말 포기하실겁니까?</p>
        <div class="confirm-buttons">
          <button onclick="giveUp()">예</button>
          <button class="secondary" onclick="cancelGiveUp()">아니오</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PASSWORD = "1119";

    const questionBank = {
      ancient: [
        {question: "○○은 간석기를 만들었다.\n○○이 살았던 시기에 있었던 일로 적절한 것은?", options: ["빗살무늬 토기를 제작하였다.", "비파형 동검을 제작하였다.", "고인돌이 축조되었다.", "철제 무기가 보급되었다.", "8조법을 시행하였다."], answer: 0, explanation: "정답: ① 빗살무늬 토기를 제작하였다.\n이유: 간석기와 빗살무늬 토기는 모두 신석기 시대의 사실이다.\n②③ 청동기, ④ 철기, ⑤ 고조선의 사실이다."},
        {question: "△△은 비파형 동검을 제작하였다.\n△△이 살았던 시기에 있었던 일로 적절한 것은?", options: ["고인돌이 축조되었다.", "빗살무늬 토기를 제작하였다.", "철제 무기가 보급되었다.", "8조법을 시행하였다.", "간석기를 만들었다."], answer: 0, explanation: "정답: ① 고인돌이 축조되었다.\n이유: 비파형 동검과 고인돌은 모두 청동기 시대의 사실이다.\n②⑤ 신석기, ③ 철기, ④ 고조선의 사실이다."},
        {question: "○○은 8조법을 시행하였다.\n○○이 살았던 시기에 있었던 일로 적절한 것은?", options: ["위만에게 왕위를 빼앗겼다.", "비파형 동검이 제작되었다.", "철제 무기가 보급되었다.", "간석기를 만들었다.", "고인돌이 축조되었다."], answer: 0, explanation: "정답: ① 위만에게 왕위를 빼앗겼다.\n이유: 8조법과 위만의 왕위 찬탈은 모두 고조선의 사실이다.\n②⑤ 청동기, ③ 철기, ④ 신석기의 사실이다."},

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function prepareQuiz(category, count, minutes) {
      pendingQuiz = { category, count, minutes };
      document.getElementById("menu-screen").classList.add("hidden");
      document.getElementById("countdown-screen").classList.remove("hidden");

          document.getElementById("countdown-num").textContent = countNum;
        } else {
          clearInterval(countdownInterval);
          document.getElementById("countdown-screen").classList.add("hidden");
          startQuiz(pendingQuiz.category, pendingQuiz.count, pendingQuiz.minutes);
        }
      }, 1000);
    }

      document.getElementById("countdown-screen").classList.add("hidden");

    function startQuiz(category, count, minutes) {
      totalQuestions = count;
      timeLeft = minutes * 60;
      answeredCount = 0;
      currentIndex = 0;
      score = 0;

      let pool = [];
      if (category === "all") {
        Object.values(questionBank).forEach(arr => pool.push(...arr));
      } else {
        pool = [...questionBank[category]];
      }

      const shuffled = shuffle(pool);
      questions = shuffled.slice(0, Math.min(count, shuffled.length));

      questions = questions.map(q => {
        const optionsWithIndex = q.options.map((opt, idx) => ({ opt, isCorrect: idx === q.answer, originalIndex: idx }));
        const shuffledOpts = shuffle(optionsWithIndex);
        const newAnswer = shuffledOpts.findIndex(item => item.isCorrect);
        
        // 해설 번호를 새로운 선지 번호에 맞게 재작성
        const numMap = ["①","②","③","④","⑤"];
        let newExplanation = q.explanation;
        shuffledOpts.forEach((item, newIdx) => {
          const oldNum = numMap[item.originalIndex];
          const newNum = numMap[newIdx];
          newExplanation = newExplanation.replace(new RegExp(oldNum, "g"), "TEMP" + newIdx);
        });
        shuffledOpts.forEach((item, newIdx) => {
          newExplanation = newExplanation.replace(new RegExp("TEMP" + newIdx, "g"), numMap[newIdx]);
        });

        return {
          question: q.question,
          options: shuffledOpts.map(item => item.opt),
          answer: newAnswer,
          explanation: newExplanation,
          userAnswer: null
        };
      });

      document.getElementById("quiz-screen").classList.remove("hidden");
      startTimer();
      showQuestion();
    }

      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      const display = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = display;
      if (timeLeft <= 60) timerEl.classList.add("warning");
      else timerEl.classList.remove("warning");
    }

    function showQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById("progress").textContent = `${currentIndex + 1} / ${totalQuestions}`;
      document.getElementById("score-display").textContent = `점수: ${score}`;
      document.getElementById("question").innerHTML = q.question.replace(/\n/g, "<br>");
      
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const div = document.createElement("div");
        div.className = "option";
        div.textContent = `${["①","②","③","④","⑤"][idx]} ${opt}`;
        div.onclick = () => selectAnswer(idx);
        optionsDiv.appendChild(div);
      });

      document.getElementById("explanation").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      pauseTimer();
      answeredCount++;

      const q = questions[currentIndex];
      q.userAnswer = selected;
      const options = document.querySelectorAll(".option");

      options.forEach((opt, idx) => {
        opt.classList.add("disabled");
        if (idx === q.answer) {
          opt.classList.add("correct");
        } else if (idx === selected) {
          opt.classList.add("wrong");
        }
      });

      if (selected === q.answer) score++;

      document.getElementById("score-display").textContent = `점수: ${score}`;
      document.getElementById("explanation").textContent = q.explanation;
      document.getElementById("explanation").classList.remove("hidden");
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < totalQuestions) {
        if (timeLeft > 0) timeLeft--;
        startTimer();
        showQuestion();
      } else {
        finishQuiz(false);
      }
    }

    function confirmGiveUp() {
      document.getElementById("confirm-box").classList.remove("hidden");
    }

    function cancelGiveUp() {
      document.getElementById("confirm-box").classList.add("hidden");
    }

    function giveUp() {
      document.getElementById("confirm-box").classList.add("hidden");
      pauseTimer();
      finishQuiz(false, true);
    }

    function finishQuiz(timeOver, isGiveUp = false) {
      pauseTimer();
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      
      const percent = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
      let msg = `${score} / ${answeredCount} (${percent}점)`;
      if (timeOver) msg += "<br><br>시간 초과로 종료되었습니다.";
      if (isGiveUp) msg += "<br><br>포기하여 종료되었습니다.";
      document.getElementById("final-score").innerHTML = msg;

      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      document.getElementById("time-left").textContent = `남은 시간: ${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;

      const reviewList = document.getElementById("review-list");
      reviewList.innerHTML = "";
      questions.slice(0, answeredCount).forEach((q, idx) => {
        const item = document.createElement("div");
        item.className = "review-item";
        const correctOpt = q.options[q.answer];
        item.innerHTML = `<span class="num">${idx+1}.</span> ${correctOpt}`;
        item.onclick = () => showReview(idx);
        reviewList.appendChild(item);
      });
    }

    function showReview(idx) {
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("review-screen").classList.remove("hidden");

      const q = questions[idx];
      document.getElementById("review-progress").textContent = `${idx+1} / ${answeredCount}`;
      document.getElementById("review-question").innerHTML = q.question.replace(/\n/g, "<br>");

      const optionsDiv = document.getElementById("review-options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = "option disabled";
        div.textContent = `${["①","②","③","④","⑤"][i]} ${opt}`;
        if (i === q.answer) div.classList.add("correct");
        if (q.userAnswer !== null && i === q.userAnswer && i !== q.answer) div.classList.add("wrong");
        optionsDiv.appendChild(div);
      });

      document.getElementById("review-explanation").textContent = q.explanation;
    }

    function backToResult() {
      document.getElementById("review-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
    }

    function goToMenu() {
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("review-screen").classList.add("hidden");
      document.getElementById("menu-screen").classList.remove("hidden");
    }

    function logout() {
      pauseTimer();
      clearInterval(countdownInterval);
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("review-screen").classList.add("hidden");
      document.getElementById("menu-screen").classList.add("hidden");
      document.getElementById("countdown-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("password").value = "";
      document.getElementById("error-msg").textContent = "";
    }
  </script>
</body>
</html>
